[project]
name = "dejavu"
version = "0.1.0"
description = "DejaVu: the on-call agent that has seen this before."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fpdf2>=2.8",
    "hindsight-client>=0.10.1",
    "httpx>=0.28",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dejavu"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real API keys; skipped when they are missing"]
